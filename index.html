<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena - tournament manager</title>
<meta name="description" content="Run FC, Tekken and Cricket tournaments from your phone. Fixtures, live tables, brackets and match schedules, with a share code so everyone can follow live.">
<link rel="canonical" href="https://iambakar.github.io/Arena-App/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Arena">
<meta property="og:title" content="Arena - Tournament Manager">
<meta property="og:description" content="Run FC, Tekken and Cricket tournaments from your phone. Fixtures, live tables, brackets and schedules. Share a code and everyone follows live.">
<meta property="og:url" content="https://iambakar.github.io/Arena-App/">
<meta property="og:image" content="https://iambakar.github.io/Arena-App/icons/social-v3.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Arena tournament manager logo with the words Football, Tekken and Cricket">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Arena - Tournament Manager">
<meta name="twitter:description" content="Fixtures, live tables, brackets and schedules for FC, Tekken and Cricket tournaments.">
<meta name="twitter:image" content="https://iambakar.github.io/Arena-App/icons/social-v3.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2457ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arena">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top glass">
  <a class="brand" href="#/" aria-label="Arena home">ARENA<i></i></a>
  <div class="tools">
    <button id="syncPill" class="pill" type="button" hidden></button>
    <button id="themeBtn" class="icon" type="button"></button>
    <button id="profileBtn" class="chip" type="button"></button>
  </div>
</header>

<div id="stale" class="stale" role="alert" hidden></div>
<main id="view"></main>
<footer id="foot" class="foot" hidden><button type="button" class="link" id="fbLink">Send feedback or report a problem</button></footer>
<dialog id="dlg" class="glass"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="setup.js"></script>
<script src="schedule.js"></script>
<script src="exporter.js"></script>
<script src="tournament.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="cloud.js"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<script src="watch.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
